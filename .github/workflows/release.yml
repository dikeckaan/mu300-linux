name: Release

# The whole release on a GitHub arm64 runner: the vendor 5.4 kernel (kernel/build-all.sh), the mainline 6.18 and 7.2
# kernels with their modules (upstream/build.sh, build-modules.sh), then tools/make-release.sh, which builds the root
# filesystems and the extras, audits every asset and publishes the release. Actions > Release > Run workflow, with the
# tag (and whether it is a prerelease: the default, which the installers and mu300-update do not offer until it is
# promoted on GitHub). The release's commit is the ref the workflow ran on; the Magisk zips follow by the Magisk
# installers workflow, started at the end (a release made with the workflow's own token does not start it by itself).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v2026.10.12'
        required: true
      prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: true
      kv618:
        description: 'The 6.18 kernel to build (empty: the newest 6.18 longterm on kernel.org)'
        required: false
      kv72:
        description: 'The 7.2 kernel to build (empty: the newest 7.2 on kernel.org)'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      MU300_REPO: ${{ github.repository }}
    steps:
      - name: Tag
        run: |
          tag_ok=1
          case "$TAG" in v[0-9]*) ;; *) tag_ok= ;; esac
          case "$TAG" in *[!0-9A-Za-z._-]*|*..*) tag_ok= ;; esac
          [ -n "$tag_ok" ] || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lz4 cpio zip unzip >/dev/null
          python3 -m pip install -q lz4 || python3 -m pip install -q --break-system-packages lz4
          docker version --format 'docker {{.Server.Version}} {{.Server.Arch}}'
          df -h / | tail -1
      - name: Kernel versions
        id: kv
        env:
          KV618: ${{ inputs.kv618 }}
          KV72: ${{ inputs.kv72 }}
        run: |
          curl -fsSL https://www.kernel.org/releases.json | KV618="$KV618" KV72="$KV72" python3 -c '
          import json, os, re, sys
          vs = [x["version"] for x in json.load(sys.stdin)["releases"] if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", x["version"])]
          def newest(series):
              got = sorted((v for v in vs if v.startswith(series + ".")), key=lambda v: [int(p) for p in v.split(".")])
              return got[-1] if got else sys.exit("no %s kernel on kernel.org" % series)
          for name, series in (("kv618", "6.18"), ("kv72", "7.2")):
              v = os.environ[name.upper()] or newest(series)
              if not re.fullmatch(series.replace(".", r"\.") + r"\.[0-9]+", v): sys.exit("not a %s kernel: %s" % (series, v))
              print(name + "=" + v)
          ' | tee -a "$GITHUB_OUTPUT"
      - name: Vendor 5.4 kernel and modules
        run: sh kernel/build-all.sh
      - name: Mainline build environment
        run: docker build -t mu300-mainline-build upstream/
      - name: Mainline 6.18
        env:
          KV: ${{ steps.kv.outputs.kv618 }}
        run: |
          docker volume create mu300-mainline
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work mu300-mainline-build bash /work/build.sh
          docker run --rm -e KV="$KV" -v mu300-mainline:/src -v "$PWD/upstream":/work mu300-mainline-build bash /work/build-modules.sh > /dev/null
          ls upstream/out/modules/*.ko | wc -l
      - name: Mainline 7.2
        env:
          KV: ${{ steps.kv.outputs.kv72 }}
        run: |
          docker run --rm -e KV="$KV" -e OUTDIR=out-7.2 -v mu300-mainline:/src -v "$PWD/upstream":/work mu300-mainline-build bash /work/build.sh
          docker run --rm -e KV="$KV" -e OUTDIR=out-7.2 -v mu300-mainline:/src -v "$PWD/upstream":/work mu300-mainline-build bash /work/build-modules.sh > /dev/null
          ls upstream/out-7.2/modules/*.ko | wc -l
      - name: Build logs
        if: failure()
        run: tail -n 60 upstream/out/modules/*.log upstream/out-7.2/modules/*.log 2>/dev/null || true
      - name: Root filesystems, extras, audit, publish
        env:
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          # the build outputs are ignored by git, so the tree is still the commit the release says it is
          git status --porcelain
          sh tools/make-release.sh "$TAG" --publish $PRERELEASE
      - name: Magisk installers
        run: gh workflow run magisk.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$TAG"
