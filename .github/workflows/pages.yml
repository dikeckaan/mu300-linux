name: Website

# Publishes site/ (plain HTML, CSS and SVG; nothing is built) to GitHub Pages: https://kaandikec.com/mu300-linux/
# Needs Settings > Pages > Source: "GitHub Actions". site/tools/ (the script that draws the diagrams) stays out.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: stage the site
        run: rsync -a --exclude 'tools/' site/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
