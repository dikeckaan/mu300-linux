<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" width="960" height="860" role="img" aria-labelledby="t d" xml:lang="tr">
<title id="t">Cihaz açılırken ne olur</title>
<desc id="d">Cihaz Linux'u deneme olarak başlatır. Linux açılırsa açılış onaylanır ve deneme hakları yeniden dolar. Açılmazsa bir hak gider; haklar bitince cihaz Android'i kendiliğinden başlatır.</desc>
<style>
text { font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #142133; }
.t-muted { fill: #526276; }
.t-white { fill: #ffffff; }
.t-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.ink { fill: #142133; } .stroke-ink { stroke: #142133; }
.paper { fill: #ffffff; } .soft { fill: #eef2f8; } .line { stroke: #c9d4e2; } .fill-line { fill: #c9d4e2; }
.lx { fill: #f2b23a; } .lx-soft { fill: #fbf0d8; } .lx-stroke { stroke: #b97700; } .t-lx { fill: #8a5900; }
.an { fill: #3fae6a; } .an-soft { fill: #def2e6; } .an-stroke { stroke: #217a47; } .t-an { fill: #17603a; }
.bl { fill: #2259d6; } .bl-soft { fill: #e3ebfb; } .bl-stroke { stroke: #2259d6; } .t-bl { fill: #1b47ad; }
.rd { fill: #c4302f; } .rd-soft { fill: #fbe3e2; } .rd-stroke { stroke: #c4302f; } .t-rd { fill: #a12625; }
.body-top { fill: #fdfdfe; } .body-side { fill: #dde4ee; } .body-edge { stroke: #b6c2d2; }
.led-white { fill: #ffffff; stroke: #b6c2d2; }
@media (prefers-color-scheme: dark) {
  text { fill: #e3ebf5; }
  .t-muted { fill: #9cabbe; }
  .ink { fill: #e3ebf5; } .stroke-ink { stroke: #e3ebf5; }
  .paper { fill: #142031; } .soft { fill: #1a283b; } .line { stroke: #34465f; } .fill-line { fill: #34465f; }
  .lx-soft { fill: #33290f; } .lx-stroke { stroke: #f2b740; } .t-lx { fill: #f2c060; }
  .an-soft { fill: #12301f; } .an-stroke { stroke: #5ccf8a; } .t-an { fill: #7ddba3; }
  .bl { fill: #5b88f0; } .bl-soft { fill: #1a2a48; } .bl-stroke { stroke: #7ea6ff; } .t-bl { fill: #9dbbff; }
  .rd-soft { fill: #3a1a1a; } .rd-stroke { stroke: #ff7b72; } .t-rd { fill: #ff9b94; }
  .body-top { fill: #2a3a52; } .body-side { fill: #1c2a3d; } .body-edge { stroke: #44587a; }
  .led-white { fill: #f4f7fb; stroke: #44587a; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<rect x="160" y="24" width="240" height="60" rx="30" class="soft line" stroke-width="2.5"/>
<text x="280" y="61" font-size="20" text-anchor="middle" font-weight="700">Cihaz açılır</text>
<path d="M 280 84 L 280 120" class="stroke-ink" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<rect x="100" y="122" width="360" height="92" rx="14" class="lx-soft lx-stroke" stroke-width="2.5"/>
<text x="280" y="162" font-size="20" text-anchor="middle">Önyükleyici Linux'u başlatır</text>
<text x="280" y="188" font-size="20" text-anchor="middle">ve bir deneme hakkı harcar</text>
<path d="M 280 214 L 280 250" class="stroke-ink" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<polygon points="280,251 480,356 280,461 80,356" class="bl-soft bl-stroke" stroke-width="2.5"/>
<text x="280" y="337" font-size="20" text-anchor="middle" font-weight="700">Linux yaklaşık bir dakika</text>
<text x="280" y="363" font-size="20" text-anchor="middle" font-weight="700">içinde açıldı mı?</text>
<text x="280" y="389" font-size="17" text-anchor="middle" class="t-muted">USB ağı ve SSH</text>
<path d="M 480 356 L 600 356" class="stroke-ink" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<text x="504" y="342" font-size="18" text-anchor="start" font-weight="700" class="t-muted">evet</text>
<rect x="602" y="310" width="330" height="92" rx="14" class="lx-soft lx-stroke" stroke-width="2.5"/>
<text x="767" y="350" font-size="20" text-anchor="middle">Açılış onaylandı:</text>
<text x="767" y="376" font-size="20" text-anchor="middle">bütün haklar geri geldi</text>
<path d="M 767 402 L 767 450" class="stroke-ink" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<rect x="637" y="452" width="260" height="60" rx="30" class="lx" stroke-width="2.5"/>
<text x="767" y="489" font-size="20" text-anchor="middle" font-weight="700">Linux'u kullanırsınız</text>
<path d="M 280 461 L 280 510" class="stroke-ink" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<text x="294" y="492" font-size="18" text-anchor="start" font-weight="700" class="t-muted">hayır</text>
<rect x="110" y="512" width="340" height="86" rx="14" class="rd-soft rd-stroke" stroke-width="2.5"/>
<text x="280" y="549" font-size="20" text-anchor="middle">Onaylanmadı:</text>
<text x="280" y="575" font-size="20" text-anchor="middle">bir hak eksildi</text>
<path d="M 280 598 L 280 634" class="stroke-ink" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<polygon points="280,635 415,700 280,765 145,700" class="bl-soft bl-stroke" stroke-width="2.5"/>
<text x="280" y="707" font-size="20" text-anchor="middle" font-weight="700">Hak kaldı mı?</text>
<path d="M 145 700 H 40 V 54 H 158" class="stroke-ink" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<text x="130" y="688" font-size="18" text-anchor="end" font-weight="700" class="t-muted">evet</text>
<g transform="translate(28 380) rotate(-90)"><text x="0" y="0" font-size="17" text-anchor="middle" class="t-muted">sonraki açılış</text></g>
<path d="M 415 700 L 600 700" class="stroke-ink" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<text x="440" y="688" font-size="18" text-anchor="start" font-weight="700" class="t-muted">hayır</text>
<rect x="602" y="660" width="330" height="80" rx="14" class="an-soft an-stroke" stroke-width="2.5"/>
<text x="767" y="694" font-size="20" text-anchor="middle" font-weight="700">Android kendiliğinden</text>
<text x="767" y="720" font-size="20" text-anchor="middle" font-weight="700">açılır</text>
<text x="40" y="806" font-size="17" text-anchor="start" class="t-muted">Deneme hakkı: 1 ile 6 arası (seçmezseniz 5).</text>
<text x="40" y="828.1" font-size="17" text-anchor="start" class="t-muted">Kilitli Linux kendiliğinden Android'e dönmez.</text>
</svg>
