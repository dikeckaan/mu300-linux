<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" aria-labelledby="boot-tr-t boot-tr-d" class="mu-dg" role="img" viewBox="0 0 960 860" xml:lang="tr"><title id="boot-tr-t">Cihaz açılırken ne olur</title><desc id="boot-tr-d">Cihaz Linux&apos;u deneme olarak başlatır. Linux açılırsa açılış onaylanır ve deneme hakları yeniden dolar. Açılmazsa bir hak gider; haklar bitince cihaz Android&apos;i kendiliğinden başlatır.</desc><style>.mu-dg text{font-family:&quot;Atkinson Hyperlegible&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif}.mu-dg .t-muted{fill:#526276}.mu-dg .ink,.mu-dg text{fill:#142133}.mu-dg .stroke-ink{stroke:#142133}.mu-dg .soft{fill:#eef2f8}.mu-dg .line{stroke:#c9d4e2}.mu-dg .lx{fill:#f2b23a}.mu-dg .lx-soft{fill:#fbf0d8}.mu-dg .lx-stroke{stroke:#b97700}.mu-dg .an-soft{fill:#def2e6}.mu-dg .an-stroke{stroke:#217a47}.mu-dg .bl-soft{fill:#e3ebfb}.mu-dg .bl-stroke{stroke:#2259d6}.mu-dg .rd-soft{fill:#fbe3e2}.mu-dg .rd-stroke{stroke:#c4302f}@media (prefers-color-scheme:dark){.mu-dg:root .t-muted,:root:not([data-theme=light]) .mu-dg .t-muted{fill:#9cabbe}.mu-dg:root .ink,.mu-dg:root text,:root:not([data-theme=light]) .mu-dg .ink,:root:not([data-theme=light]) .mu-dg text{fill:#e3ebf5}.mu-dg:root .stroke-ink,:root:not([data-theme=light]) .mu-dg .stroke-ink{stroke:#e3ebf5}.mu-dg:root .soft,:root:not([data-theme=light]) .mu-dg .soft{fill:#1a283b}.mu-dg:root .line,:root:not([data-theme=light]) .mu-dg .line{stroke:#34465f}.mu-dg:root .lx-soft,:root:not([data-theme=light]) .mu-dg .lx-soft{fill:#33290f}.mu-dg:root .lx-stroke,:root:not([data-theme=light]) .mu-dg .lx-stroke{stroke:#f2b740}.mu-dg:root .an-soft,:root:not([data-theme=light]) .mu-dg .an-soft{fill:#12301f}.mu-dg:root .an-stroke,:root:not([data-theme=light]) .mu-dg .an-stroke{stroke:#5ccf8a}.mu-dg:root .bl-soft,:root:not([data-theme=light]) .mu-dg .bl-soft{fill:#1a2a48}.mu-dg:root .bl-stroke,:root:not([data-theme=light]) .mu-dg .bl-stroke{stroke:#7ea6ff}.mu-dg:root .rd-soft,:root:not([data-theme=light]) .mu-dg .rd-soft{fill:#3a1a1a}.mu-dg:root .rd-stroke,:root:not([data-theme=light]) .mu-dg .rd-stroke{stroke:#ff7b72}}:root[data-theme=dark] .mu-dg .t-muted{fill:#9cabbe}:root[data-theme=dark] .mu-dg .ink,:root[data-theme=dark] .mu-dg text{fill:#e3ebf5}:root[data-theme=dark] .mu-dg .stroke-ink{stroke:#e3ebf5}:root[data-theme=dark] .mu-dg .soft{fill:#1a283b}:root[data-theme=dark] .mu-dg .line{stroke:#34465f}:root[data-theme=dark] .mu-dg .lx-soft{fill:#33290f}:root[data-theme=dark] .mu-dg .lx-stroke{stroke:#f2b740}:root[data-theme=dark] .mu-dg .an-soft{fill:#12301f}:root[data-theme=dark] .mu-dg .an-stroke{stroke:#5ccf8a}:root[data-theme=dark] .mu-dg .bl-soft{fill:#1a2a48}:root[data-theme=dark] .mu-dg .bl-stroke{stroke:#7ea6ff}:root[data-theme=dark] .mu-dg .rd-soft{fill:#3a1a1a}:root[data-theme=dark] .mu-dg .rd-stroke{stroke:#ff7b72}</style><defs><marker id="boot-tr-ah" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs><rect width="240" height="60" x="160" y="24" stroke-width="2.5" class="soft line" rx="30"/><text x="280" y="61" font-size="20" font-weight="700" text-anchor="middle">Cihaz açılır</text><path fill="none" stroke-width="2.5" marker-end="url(#boot-tr-ah)" d="M 280 84 L 280 120" class="stroke-ink"/><rect width="360" height="92" x="100" y="122" stroke-width="2.5" class="lx-soft lx-stroke" rx="14"/><text x="280" y="162" font-size="20" text-anchor="middle">Önyükleyici Linux&apos;u başlatır</text><text x="280" y="188" font-size="20" text-anchor="middle">ve bir deneme hakkı harcar</text><path fill="none" stroke-width="2.5" marker-end="url(#boot-tr-ah)" d="M 280 214 L 280 250" class="stroke-ink"/><polygon stroke-width="2.5" points="280 251 480 356 280 461 80 356" class="bl-soft bl-stroke"/><text x="280" y="337" font-size="20" font-weight="700" text-anchor="middle">Linux yaklaşık bir dakika</text><text x="280" y="363" font-size="20" font-weight="700" text-anchor="middle">içinde açıldı mı?</text><text x="280" y="389" class="t-muted" font-size="17" text-anchor="middle">USB ağı ve SSH</text><path fill="none" stroke-width="2.5" marker-end="url(#boot-tr-ah)" d="M 480 356 L 600 356" class="stroke-ink"/><text x="504" y="342" class="t-muted" font-size="18" font-weight="700" text-anchor="start">evet</text><rect width="330" height="92" x="602" y="310" stroke-width="2.5" class="lx-soft lx-stroke" rx="14"/><text x="767" y="350" font-size="20" text-anchor="middle">Açılış onaylandı:</text><text x="767" y="376" font-size="20" text-anchor="middle">bütün haklar geri geldi</text><path fill="none" stroke-width="2.5" marker-end="url(#boot-tr-ah)" d="M 767 402 L 767 450" class="stroke-ink"/><rect width="260" height="60" x="637" y="452" stroke-width="2.5" class="lx" rx="30"/><text x="767" y="489" font-size="20" font-weight="700" text-anchor="middle">Linux&apos;u kullanırsınız</text><path fill="none" stroke-width="2.5" marker-end="url(#boot-tr-ah)" d="M 280 461 L 280 510" class="stroke-ink"/><text x="294" y="492" class="t-muted" font-size="18" font-weight="700" text-anchor="start">hayır</text><rect width="340" height="86" x="110" y="512" stroke-width="2.5" class="rd-soft rd-stroke" rx="14"/><text x="280" y="549" font-size="20" text-anchor="middle">Onaylanmadı:</text><text x="280" y="575" font-size="20" text-anchor="middle">bir hak eksildi</text><path fill="none" stroke-width="2.5" marker-end="url(#boot-tr-ah)" d="M 280 598 L 280 634" class="stroke-ink"/><polygon stroke-width="2.5" points="280 635 415 700 280 765 145 700" class="bl-soft bl-stroke"/><text x="280" y="707" font-size="20" font-weight="700" text-anchor="middle">Hak kaldı mı?</text><path fill="none" stroke-width="2.5" marker-end="url(#boot-tr-ah)" d="M 145 700 H 40 V 54 H 158" class="stroke-ink"/><text x="130" y="688" class="t-muted" font-size="18" font-weight="700" text-anchor="end">evet</text><g><text x="0" y="0" class="t-muted" font-size="17" text-anchor="middle" transform="translate(28 380) rotate(-90)">sonraki açılış</text></g><path fill="none" stroke-width="2.5" marker-end="url(#boot-tr-ah)" d="M 415 700 L 600 700" class="stroke-ink"/><text x="440" y="688" class="t-muted" font-size="18" font-weight="700" text-anchor="start">hayır</text><rect width="330" height="80" x="602" y="660" stroke-width="2.5" class="an-soft an-stroke" rx="14"/><text x="767" y="694" font-size="20" font-weight="700" text-anchor="middle">Android kendiliğinden</text><text x="767" y="720" font-size="20" font-weight="700" text-anchor="middle">açılır</text><text x="40" y="806" class="t-muted" font-size="17" text-anchor="start">Deneme hakkı: 1 ile 6 arası (seçmezseniz 5).</text><text x="40" y="828.1" class="t-muted" font-size="17" text-anchor="start">Kilitli Linux kendiliğinden Android&apos;e dönmez.</text></svg>