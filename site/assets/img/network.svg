<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410" role="img" aria-labelledby="t d" xml:lang="en">
<title id="t">How the device connects everything</title>
<desc id="d">Phones and laptops join the device's Wi-Fi hotspot or plug into its USB port. The device takes them to the internet over 5G or LTE with its SIM card, or over another Wi-Fi network.</desc>
<style>
