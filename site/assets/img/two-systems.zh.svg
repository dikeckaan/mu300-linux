<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" aria-labelledby="two-zh-t two-zh-d" class="mu-dg" role="img" viewBox="0 0 960 440" xml:lang="zh"><title id="two-zh-t">一台设备上的 Android 和 Linux</title><desc id="two-zh-d">内部存储：Android 的分区保持原样，Linux 安装在它们后面的空闲空间里。设备有两个启动槽位；Android 保留自己的槽位，Linux 的启动镜像写入另一个。</desc><style>.mu-dg text{font-family:&quot;Atkinson Hyperlegible&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif}.mu-dg .t-muted{fill:#526276}.mu-dg .ink,.mu-dg text{fill:#142133}.mu-dg .paper{fill:#fff}.mu-dg .lx{fill:#f2b23a}.mu-dg .lx-soft{fill:#fbf0d8}.mu-dg .lx-stroke{stroke:#b97700}.mu-dg .t-lx{fill:#8a5900}.mu-dg .an{fill:#3fae6a}.mu-dg .an-soft{fill:#def2e6}.mu-dg .an-stroke{stroke:#217a47}.mu-dg .t-an{fill:#17603a}.mu-dg .bl{fill:#2259d6}.mu-dg .bl-soft{fill:#e3ebfb}.mu-dg .bl-stroke{stroke:#2259d6}.mu-dg .t-bl{fill:#1b47ad}@media (prefers-color-scheme:dark){.mu-dg:root .t-muted,:root:not([data-theme=light]) .mu-dg .t-muted{fill:#9cabbe}.mu-dg:root .ink,.mu-dg:root text,:root:not([data-theme=light]) .mu-dg .ink,:root:not([data-theme=light]) .mu-dg text{fill:#e3ebf5}.mu-dg:root .paper,:root:not([data-theme=light]) .mu-dg .paper{fill:#142031}.mu-dg:root .lx-soft,:root:not([data-theme=light]) .mu-dg .lx-soft{fill:#33290f}.mu-dg:root .lx-stroke,:root:not([data-theme=light]) .mu-dg .lx-stroke{stroke:#f2b740}.mu-dg:root .t-lx,:root:not([data-theme=light]) .mu-dg .t-lx{fill:#f2c060}.mu-dg:root .an-soft,:root:not([data-theme=light]) .mu-dg .an-soft{fill:#12301f}.mu-dg:root .an-stroke,:root:not([data-theme=light]) .mu-dg .an-stroke{stroke:#5ccf8a}.mu-dg:root .t-an,:root:not([data-theme=light]) .mu-dg .t-an{fill:#7ddba3}.mu-dg:root .bl,:root:not([data-theme=light]) .mu-dg .bl{fill:#5b88f0}.mu-dg:root .bl-soft,:root:not([data-theme=light]) .mu-dg .bl-soft{fill:#1a2a48}.mu-dg:root .bl-stroke,:root:not([data-theme=light]) .mu-dg 