<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" xml:lang="zh">
<title id="t">一台设备上的 Android 和 Linux</title>
<desc id="d">内部存储：Android 的分区保持原样，Linux 安装在它们后面的空闲空间里。设备有两个启动槽位；Android 保留自己的槽位，Linux 的启动镜像写入另一个。</desc>
<style>
text { font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #142133; }
.t-muted { fill: #526276; }
.t-white { fill: #ffffff; }
.t-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.ink { fill: #142133; } .stroke-ink { stroke: #142133; }
.paper { fill: #ffffff; } .soft { fill: #eef2f8; } .line { stroke: #c9d4e2; } .fill-line { fill: #c9d4e2; }
.lx { fill: #f2b23a; } .lx-soft { fill: #fbf0d8; } .lx-stroke { stroke: #b97700; } .t-lx { fill: #8a5900; }
.an { fill: #3fae6a; } .an-soft { fill: #def2e6; } .an-stroke { stroke: #217a47; } .t-an { fill: #17603a; }
.bl { fill: #2259d6; } .bl-soft { fill: #e3ebfb; } .bl-stroke { stroke: #2259d6; } .t-bl { fill: #1b47ad; }
.rd { fill: #c4302f; } .rd-soft { fill: #fbe3e2; } .rd-stroke { stroke: #c4302f; } .t-rd { fill: #a12625; }
.body-top { fill: #fdfdfe; } .body-side { fill: #dde4ee; } .body-edge { stroke: #b6c2d2; }
.led-white { fill: #ffffff; stroke: #b6c2d2; }
@media (prefers-color-scheme: dark) {
  text { fill: #e3ebf5; }
  .t-muted { fill: #9cabbe; }
  .ink { fill: #e3ebf5; } .stroke-ink { stroke: #e3ebf5; }
  .paper { fill: #142031; } .soft { fill: #1a283b; } .line { stroke: #34465f; } .fill-line { fill: #34465f; }
  .lx-soft { fill: #33290f; } .lx-stroke { stroke: #f2b740; } .t-lx { fill: #f2c060; }
  .an-soft { fill: #12301f; } .an-stroke { stroke: #5ccf8a; } .t-an { fill: #7ddba3; }
  .bl { fill: #5b88f0; } .bl-soft { fill: #1a2a48; } .bl-stroke { stroke: #7ea6ff; } .t-bl { fill: #9dbbff; }
  .rd-soft { fill: #3a1a1a; } .rd-stroke { stroke: #ff7b72; } .t-rd { fill: #ff9b94; }
  .body-top { fill: #2a3a52; } .body-side { fill: #1c2a3d; } .body-edge { stroke: #44587a; }
  .led-white { fill: #f4f7fb; stroke: #44587a; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs>
<text x="24" y="40" font-size="20" text-anchor="start" font-weight="700">内部存储（常见的 64 GB 设备）</text>
<rect x="24" y="62" width="424" height="96" rx="14" class="an-soft"/>
<rect x="434" y="62" width="502" height="96" rx="14" class="lx-soft"/>
<rect x="431" y="62" width="6" height="96" class="an"/>
<line x1="69.5556" y1="138" x2="69.5556" y2="152" class="an-stroke" stroke-width="1.5" opacity=".35"/>
<line x1="115.111" y1="138" x2="115.111" y2="152" class="an-stroke" stroke-width="1.5" opacity=".35"/>
<line x1="160.667" y1="138" x2="160.667" y2="152" class="an-stroke" stroke-width="1.5" opacity=".35"/>
<line x1="206.222" y1="138" x2="206.222" y2="152" class="an-stroke" stroke-width="1.5" opacity=".35"/>
<line x1="251.778" y1="138" x2="251.778" y2="152" class="an-stroke" stroke-width="1.5" opacity=".35"/>
<line x1="297.333" y1="138" x2="297.333" y2="152" class="an-stroke" stroke-width="1.5" opacity=".35"/>
<line x1="342.889" y1="138" x2="342.889" y2="152" class="an-stroke" stroke-width="1.5" opacity=".35"/>
<line x1="388.444" y1="138" x2="388.444" y2="152" class="an-stroke" stroke-width="1.5" opacity=".35"/>
<text x="44" y="104" font-size="19" text-anchor="start" font-weight="700" class="t-an">Android 的分区</text>
<text x="44" y="132" font-size="16" text-anchor="start" class="t-muted">系统、应用、你的数据</text>
<text x="458" y="104" font-size="19" text-anchor="start" font-weight="700" class="t-lx">空闲空间，约 32 GiB</text>
<text x="458" y="132" font-size="16" text-anchor="start" class="t-muted">Ubuntu 和/或 OpenWrt</text>
<path d="M 229 162 v 18" class="an-stroke" stroke-width="2"/>
<text x="229" y="202" font-size="16" text-anchor="middle" font-weight="700" class="t-an">保持原样</text>
<path d="M 685 162 v 18" class="lx-stroke" stroke-width="2"/>
<text x="685" y="202" font-size="16" text-anchor="middle" font-weight="700" class="t-lx">Linux 住在这里</text>
<text x="24" y="262" font-size="20" text-anchor="start" font-weight="700">两个启动槽位：同一栋房子的两扇前门</text>
<rect x="24" y="284" width="300" height="118" rx="16" class="paper an-stroke" stroke-width="3" fill-opacity="1"/>
<rect x="54" y="304" width="56" height="78" rx="8" class="an"/><circle cx="98" cy="346" r="4" class="paper"/>
<text x="134" y="334" font-size="19" text-anchor="start" font-weight="700">Android 的槽位</text>
<text x="134" y="362" font-size="16" text-anchor="start" class="t-muted">从不写入</text>
<rect x="344" y="284" width="300" height="118" rx="16" class="paper lx-stroke" stroke-width="3" fill-opacity="1"/>
<rect x="374" y="304" width="56" height="78" rx="8" class="lx"/><circle cx="418" cy="346" r="4" class="paper"/>
<text x="454" y="334" font-size="19" text-anchor="start" font-weight="700">另一个槽位</text>
<text x="454" y="362" font-size="16" text-anchor="start" class="t-muted">Linux 的启动镜像</text>
<path d="M 702 292 h 46 l 18 18 v 68 a 6 6 0 0 1 -6 6 h -58 a 6 6 0 0 1 -6 -6 v -80 a 6 6 0 0 1 6 -6 z" class="bl-soft bl-stroke" stroke-width="3"/>
<rect x="710" y="302" width="7" height="16" rx="2" class="bl"/>
<rect x="722" y="302" width="7" height="16" rx="2" class="bl"/>
<rect x="734" y="302" width="7" height="16" rx="2" class="bl"/>
<rect x="746" y="302" width="7" height="16" rx="2" class="bl"/>
<text x="780" y="326" font-size="16" text-anchor="start" class="t-bl">F50：Linux 也可以</text>
<text x="780" y="346.8" font-size="16" text-anchor="start" class="t-bl">放在 SD 卡上</text>
</svg>
